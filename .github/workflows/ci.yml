# Build and test on every push and pull request.
#
# The suite is the same one `pnpm test` runs locally: it builds both halves with
# tsdown, then drives the host half against a stand-in registry. Action refs are
# pinned to full commit SHAs with the reviewed major in a trailing comment, so a
# moved tag cannot change what runs here.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
